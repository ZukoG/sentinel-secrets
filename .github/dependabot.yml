# Dependabot opens pull requests when a dependency falls behind. Each PR
# still has to pass the full CI suite before it can be merged.
version: 2
updates:
  # Actions used in .github/workflows/ci.yml (checkout, setup-python).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Dev tooling declared in pyproject.toml (pytest, bandit, pip-audit).
  # The tool itself has no runtime dependencies to update.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-tools:
        patterns: ["*"]
